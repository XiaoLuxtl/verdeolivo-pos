<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test DaisyUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/daisyui@5.3.7/dist/full.min.js"></script>
  </head>
  <body class="p-4">
    <h1 class="text-2xl font-bold mb-4">Test DaisyUI</h1>

    <button class="btn">Default Button</button>
    <button class="btn btn-primary">Primary Button</button>
    <button class="btn btn-success">Success Button</button>
    <button class="btn btn-warning">Warning Button</button>
    <button class="btn btn-error">Error Button</button>

    <div class="mt-4">
      <input
        type="text"
        placeholder="Test input"
        class="input input-bordered"
      />
    </div>

    <div class="card bg-base-100 shadow-xl mt-4">
      <div class="card-body">
        <h3 class="card-title">Test Card</h3>
        <p>This is a test card to verify DaisyUI is working.</p>
      </div>
    </div>
  </body>
</html>
